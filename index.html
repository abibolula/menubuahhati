// ---------- State lokal & penyimpanan yang toleran terhadap mode privat. ----------
const $=s=>document.querySelector(s),main=$('#main'),dialog=$('#dialog');
let memoryWarning=false;
function read(key,fallback){try{return JSON.parse(localStorage.getItem('mbh:'+key))??fallback}catch{return fallback}}
function save(key,value){try{localStorage.setItem('mbh:'+key,JSON.stringify(value))}catch{if(!memoryWarning){memoryWarning=true;toast('Penyimpanan browser tidak tersedia. Perubahan hanya bertahan selama sesi ini.')}}}
function dateKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const rawFav=read('favorites',[]),rawChecks=read('checks',{}),rawPlan=read('plan',{});
const state={page:'home',query:'',filters:{age:'',mealTime:'',protein:'',category:'',tag:''},favorites:new Set(Array.isArray(rawFav)?rawFav.filter(id=>CONFIG.recipes.some(r=>r.id===id)):[]),checks:rawChecks&&typeof rawChecks==='object'&&!Array.isArray(rawChecks)?rawChecks:{},plan:rawPlan&&rawPlan.date===dateKey()&&rawPlan.slots&&typeof rawPlan.slots==='object'&&!Array.isArray(rawPlan.slots)?rawPlan.slots:{},date:dateKey(),random:[],recipe:null,step:0,dialogMode:'',slot:null,pickQuery:'',lastFocus:null,scrollPositions:{}};
const validIds=new Set(CONFIG.recipes.map(r=>r.id));
for(const slot of Object.keys(state.plan))if(!CONFIG.meals.includes(slot)||!validIds.has(state.plan[slot]))delete state.plan[slot];
function recipe(id){return CONFIG.recipes.find(r=>r.id===id)}
function difficulty(r){return r.difficulty||CONFIG.recipeDefaults.difficulty}
function primaryIngredients(r){return r.mainIngredients||r.ingredients.slice(0,3).map(i=>i.name)}
let toastTimer;
function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3400)}
const observer='IntersectionObserver' in window?new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}},{threshold:.04}):null;
function observe(){document.querySelectorAll('.reveal:not(.visible)').forEach(el=>observer?observer.observe(el):el.classList.add('visible'))}
function navItems(){return [['home','home',CONFIG.uiText.home],['recipes','book',CONFIG.uiText.recipes],...(CONFIG.features.mealPlan?[['today','calendar',CONFIG.uiText.today]]:[]),...(CONFIG.features.favorites?[['favorites','bookmark',CONFIG.uiText.favorites]]:[])]}
function renderNav(){const html=navItems().map(([page,ico,label])=>`<button class="nav-button ${state.page===page?'active':''}" data-nav="${page}" ${state.page===page?'aria-current="page"':''}>${icon(ico)}<span>${esc(label)}</span>${page==='favorites'?`<span class="counter" aria-label="${state.favorites.size} menu favorit">${state.favorites.size}</span>`:''}</button>`).join('');$('#desktop-nav').innerHTML=html;$('#bottom-nav').innerHTML=html;$('#bottom-nav').style.setProperty('--nav-count',navItems().length)}
function card(r,index=0){const saved=state.favorites.has(r.id),number=CONFIG.recipes.indexOf(r)+1;const bg=['#e9eadd','#f0e1d0','#e4e8df','#efdfd6'][number%4];return `<article class="recipe-card" style="--i:${index%4};--art-bg:${bg}"><div class="card-art"><span class="recipe-number">recette / ${String(number).padStart(2,'0')}</span>${foodArt(r)}</div>${CONFIG.features.favorites?`<button class="icon-button bookmark ${saved?'saved':''}" data-fav="${esc(r.id)}" aria-label="${saved?'Hapus':'Simpan'} ${esc(r.name)} ${saved?'dari':'ke'} favorit" aria-pressed="${saved}">${icon('bookmark')}</button>`:''}<div class="card-content"><p class="category-label">${esc(r.category)}</p><h3 class="card-title"><button data-detail="${esc(r.id)}">${esc(r.name)}</button></h3><div class="card-meta"><span class="age-label">${esc(r.age)}</span>${icon('clock')}<span>${r.cookingTime} menit</span></div><p class="card-ingredients">${primaryIngredients(r).map(esc).join(' · ')}</p><div class="card-bottom"><span>${esc(difficulty(r))}</span><span>${esc(CONFIG.uiText.viewRecipe)} ${icon('arrow')}</span></div></div></article>`}
function randomize(){const other=CONFIG.recipes.filter(r=>!state.random.includes(r.id)),pool=other.length>=Math.min(4,CONFIG.recipes.length)?other:[...CONFIG.recipes];for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}state.random=pool.slice(0,4).map(r=>r.id)}
function renderRandomRecipes(){const el=$('#random-grid');if(el)el.innerHTML=state.random.map(id=>recipe(id)).filter(Boolean).map(card).join('')}
function searchMarkup(){return CONFIG.features.search?`<div class="searchbox">${icon('search')}<label for="search" class="sr-only">${esc(CONFIG.uiText.searchPlaceholder)}</label><input id="search" type="search" autocomplete="off" placeholder="${esc(CONFIG.uiText.searchPlaceholder)}" value="${esc(state.query)}"><button class="icon-button" data-clear-search aria-label="Effacer la recherche" ${state.query?'':'hidden'}>${icon('close')}</button></div>`:''}
function values(field,initial){return [...new Set([...initial,...CONFIG.recipes.flatMap(r=>Array.isArray(r[field])?r[field]:[r[field]]).filter(Boolean)])]}
function filterRow(field,label,options){return `<div class="filter-row"><span class="filter-label" id="label-${field}">${label}</span><div class="chips" role="group" aria-labelledby="label-${field}">${['',...options].map(v=>`<button class="chip ${state.filters[field]===v?'active':''}" data-filter="${field}" data-value="${esc(v)}" aria-pressed="${state.filters[field]===v}">${esc(v||'Semua')}</button>`).join('')}</div></div>`}
function renderFilters(){return CONFIG.features.filters?`${filterRow('mealTime','Waktu',values('mealTime',CONFIG.meals))}${filterRow('protein','Protein',values('protein',CONFIG.proteins))}${filterRow('category','Jenis',values('category',CONFIG.types))}<div class="filter-summary"><span id="filter-count"></span><button class="reset" data-reset>${esc(CONFIG.uiText.clearFilters)}</button></div>`:''}
function ageFilter(){return CONFIG.features.filters?filterRow('age','Usia',values('age',CONFIG.ages)):''}
function match(r,q,filters){const normal=x=>String(x??'').toLocaleLowerCase('id').normalize('NFD').replace(/[\u0300-\u036f]/g,'');const hay=normal([r.name,r.category,r.age,r.protein,r.mealTime,...(r.tags||[]),...r.ingredients.map(i=>i.name)].join(' '));return normal(q).trim().split(/\s+/).every(term=>hay.includes(term))&&Object.entries(filters).every(([key,val])=>!val||(key==='tag'?(r.tags||[]).includes(val):Array.isArray(r[key])?r[key].includes(val):r[key]===val))}
function filtered(){return CONFIG.recipes.filter(r=>match(r,CONFIG.features.search?state.query:'',CONFIG.features.filters?state.filters:{}))}
function empty(kind){const u=CONFIG.uiText;return `<div class="empty">${icon(kind==='favorite'?'bookmark':'search')}<h3>${esc(kind==='favorite'?u.favoriteEmpty:u.noResults)}</h3><p>${esc(kind==='favorite'?u.favoriteDescription:u.noResultsDescription)}</p><button class="btn secondary" ${kind==='favorite'?'data-nav="recipes"':'data-reset'}>${esc(kind==='favorite'?u.allRecipes:'Reset pencarian & filter')}</button></div>`}
function renderRecipes(){const el=$('#recipe-grid');if(!el)return;const rs=filtered();el.innerHTML=rs.length?rs.map(card).join(''):empty('search');$('#result-count').textContent=`${rs.length} dari ${CONFIG.recipes.length} resep`;if($('#filter-count')){const count=Object.values(state.filters).filter(Boolean).length;$('#filter-count').textContent=count?`${count} filter aktif${state.filters.tag?' · '+state.filters.tag:''}`:'Semua rasa, semua kemungkinan';$('#filter-count').nextElementSibling.hidden=!count&&!state.query}const clear=$('[data-clear-search]');if(clear){clear.hidden=!state.query;clear.setAttribute('aria-label','Hapus pencarian')}document.querySelectorAll('[data-filter]').forEach(b=>{const active=state.filters[b.dataset.filter]===b.dataset.value;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)})}
function collection(){return `<section class="section collection" id="collection"><div class="section-head"><div><h2>${esc(CONFIG.uiText.collection)}</h2><p>Resep sederhana untuk cerita makan yang berwarna.</p></div><span class="result-count" id="result-count" role="status" aria-live="polite"></span></div><div class="filter-panel">${renderFilters()}</div><div class="grid" id="recipe-grid"></div></section>`}
function tipsBanner(){return `<aside class="tips-banner reveal">${icon('leaf')}<div><h3>${esc(CONFIG.uiText.tipTitle)}</h3><p>${esc(CONFIG.uiText.tipBody)}</p></div><button class="text-button" data-safety>${esc(CONFIG.uiText.tipAction)} ${icon('arrow')}</button></aside>`}
function renderHome(){const hour=new Date().getHours(),greeting=hour<11?'Selamat pagi':hour<15?'Selamat siang':hour<18?'Selamat sore':'Selamat malam';const title=esc(CONFIG.app.heroTitle).replace('Makan Apa?','<em>Makan Apa?</em>');main.innerHTML=`<div class="page"><section class="hero"><div class="hero-copy"><div class="greeting">${icon(hour<18?'sun':'moon')} ${greeting}, orang tua hebat.</div><span class="eyebrow">Resep kecil untuk tumbuh bersama</span><h1>${title}</h1><p>${esc(CONFIG.app.heroSubtitle)}</p><div class="hero-actions"><button class="btn" data-explore>${esc(CONFIG.uiText.explore)} ${icon('arrow')}</button><button class="btn secondary" data-nav="recipes">${esc(CONFIG.uiText.allRecipes)}</button></div><div class="hero-footnote">${icon('heart')}<span>${CONFIG.recipes.length} inspirasi menu</span><span>·</span><span>Diracik dengan penuh perhatian</span></div></div><div class="hero-art">${heroArt()}</div></section><section class="search-area" aria-label="Cari inspirasi resep">${searchMarkup()}${ageFilter()}</section>${CONFIG.features.randomMenu?`<section class="section" id="recommendations"><div class="section-head"><div><h2>${esc(CONFIG.uiText.recommendations)}</h2><p>Sedikit inspirasi untuk meja makan si kecil.</p></div><button class="text-button" data-random>${icon('shuffle')}${esc(CONFIG.uiText.randomMenu)}</button></div><div class="grid recommendations" id="random-grid"></div></section>`:''}${CONFIG.features.filters?`<section class="section reveal"><div class="section-head"><div><h2>${esc(CONFIG.uiText.categories)}</h2><p>Mulai dari bahan atau menu kesukaan si kecil.</p></div></div><div class="categories">${CONFIG.categories.map(c=>`<button class="category-tile" data-category="${esc(c.value)}" data-field="${esc(c.field)}">${icon(c.icon)}${esc(c.label)}</button>`).join('')}</div></section>`:''}${collection()}${tipsBanner()}</div>`;renderRandomRecipes();renderRecipes()}
function renderRecipePage(){main.innerHTML=`<div class="page"><div class="page-heading"><span class="eyebrow">Buku resep keluarga</span><h1>Temukan menu kesukaan.</h1><p>${esc(CONFIG.app.subheadline)}</p></div><section class="search-area">${searchMarkup()}${ageFilter()}</section>${collection()}${tipsBanner()}</div>`;renderRecipes()}
function renderFavorites(){main.innerHTML=`<div class="page"><div class="page-heading"><span class="eyebrow">Disimpan dengan cinta</span><h1>Menu Favorit</h1><p>${state.favorites.size} resep tersimpan untuk dimasak kembali.</p></div><section class="grid" id="favorite-grid">${CONFIG.recipes.filter(r=>state.favorites.has(r.id)).map(card).join('')||empty('favorite')}</section></div>`}

function renderMealPlan(){checkDate();const count=CONFIG.meals.filter(m=>state.plan[m]).length;main.innerHTML=`<div class="page"><div class="page-heading"><span class="eyebrow">Catatan makan si kecil</span><h1>Menu Hari Ini</h1><p>${count?`${count} dari ${CONFIG.meals.length} waktu makan sudah direncanakan. Pilihan sederhana, hari yang lebih tenang.`:esc(CONFIG.uiText.planEmpty)+'. '+esc(CONFIG.uiText.planDescription)}</p></div><div class="plan-date">${icon('calendar')}${new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}</div><section class="plan-grid">${CONFIG.meals.map((slot,i)=>{const r=recipe(state.plan[slot]);return `<article class="plan-slot"><div class="slot-heading">${icon(['sun','bowl','moon','cake'][i%4])}<h2>${esc(slot)}</h2><small>${r?'Sudah dipilih':'Belum diisi'}</small></div>${r?`<div class="plan-recipe"><div class="plan-art">${foodArt(r)}</div><div><h3>${esc(r.name)}</h3><p>${esc(r.age)} · ${r.cookingTime} menit</p></div></div><div class="slot-actions"><button class="text-button" data-detail="${esc(r.id)}">${esc(CONFIG.uiText.viewRecipe)} ${icon('arrow')}</button><button class="text-button" data-slot="${esc(slot)}">Ganti menu</button><button class="text-button remove" data-remove-slot="${esc(slot)}" aria-label="Hapus menu ${esc(slot)}">${icon('trash')} Hapus</button></div>`:`<button class="slot-empty" data-slot="${esc(slot)}">${esc(CONFIG.uiText.chooseMenu)}</button>`}</article>`}).join('')}</section><p class="notice">Rencana disimpan untuk tanggal hari ini di browser ini dan dikosongkan saat berganti hari. Pilih menu sesuai kebutuhan; tidak semua slot harus diisi.</p>${tipsBanner()}</div>`}

function openDialog(html,mode){state.dialogMode=mode;if(!dialog.open){state.lastFocus=document.activeElement;document.body.style.overflow='hidden'}dialog.innerHTML=html;if(!dialog.open)dialog.showModal();dialog.scrollTop=0;const focus=dialog.querySelector('input[type="search"]')||dialog.querySelector('[data-close]');if(focus)focus.focus({preventScroll:true})}

let backdropDown=false;dialog.addEventListener('pointerdown',e=>{const r=dialog.getBoundingClientRect();backdropDown=e.target===dialog&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)});dialog.addEventListener('click',e=>{if(backdropDown&&e.target===dialog)closeDialog();backdropDown=false});
function checkedFor(id){return Array.isArray(state.checks[id])?state.checks[id]:[]}
function openDetail(id){const r=recipe(id);if(!r)return;state.recipe=id;const checked=checkedFor(id);openDialog(`${dialogTop('Buku resep · '+String(CONFIG.recipes.indexOf(r)+1).padStart(2,'0'))}<div class="dialog-inner"><div class="detail-heading"><div class="detail-art">${foodArt(r)}</div><div><p class="category-label">${esc(r.category)} · ${esc(r.mealTime)}</p><h2 id="dialog-title">${esc(r.name)}</h2><div class="detail-meta"><span>${esc(r.age)}</span><span>${r.cookingTime} menit</span><span>${esc(difficulty(r))}</span></div></div></div><p class="portion">${esc(r.portion||CONFIG.recipeDefaults.portion)} Waktu memasak adalah perkiraan, termasuk persiapan dasar; lanjutkan hingga bahan benar-benar matang.</p><section class="detail-section"><h3>Bahan <span class="ingredient-count" id="ingredient-count">${checked.filter(i=>Number.isInteger(i)&&i>=0&&i<r.ingredients.length).length}/${r.ingredients.length} siap</span></h3><ul class="ingredients">${r.ingredients.map((ing,i)=>`<li><label class="ingredient"><input type="checkbox" data-check="${i}" ${checked.includes(i)?'checked':''}><span><strong>${esc(ing.amount)}</strong> ${esc(ing.name)}</span></label></li>`).join('')}</ul></section><section class="detail-section"><h3>Cara Membuat</h3><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section><div class="notes-grid"><section class="note-box"><h4>Tekstur akhir</h4><p>${esc(r.texture)}</p></section><section class="note-box"><h4>Tips penyajian</h4><p>${esc(r.tips)}</p></section><section class="note-box allergy"><h4>Kenali alergen</h4><p>${r.allergens.length?esc(r.allergens.join(', '))+'. Perkenalkan bahan alergen baru satu per satu; gunakan kombinasi yang sudah ditoleransi.':'Tidak ada alergen umum yang teridentifikasi pada bahan yang tercantum. Reaksi individual tetap mungkin terjadi.'} Periksa label bahan kemasan.</p></section><section class="note-box"><h4>Penyimpanan</h4><p>${esc(r.storage||(r.category==='Bubur'||r.category==='Nasi Tim'?CONFIG.recipeDefaults.riceStorage:CONFIG.recipeDefaults.storage))}</p></section></div><div class="detail-safety"><strong>Catatan kecil untuk keamanan</strong><br>${esc(r.safety||CONFIG.recipeDefaults.safety)}<br>Sesuaikan bahan, tekstur, dan porsi dengan kondisi anak.</div></div><div class="dialog-actions">${CONFIG.features.cookingMode?`<button class="btn" data-cook>${icon('chef')}${esc(CONFIG.uiText.startCooking)}</button>`:''}${CONFIG.features.mealPlan?`<button class="btn secondary meal-detail" data-add-plan aria-label="Tambahkan resep ke Menu Hari Ini">${icon('calendar')} Menu Hari Ini</button>`:''}${CONFIG.features.favorites?`<button class="icon-button ${state.favorites.has(id)?'saved':''}" data-fav="${esc(id)}" aria-pressed="${state.favorites.has(id)}" aria-label="${state.favorites.has(id)?'Hapus dari':'Simpan ke'} favorit">${icon('bookmark')}</button>`:''}</div>`,'detail')}
function renderCooking(){const r=recipe(state.recipe);if(!r)return;const i=state.step;openDialog(`${dialogTop('Cooking mode')}<div class="cook"><h2 id="dialog-title">${esc(r.name)}</h2><div class="cook-label"><span>Langkah ${i+1} dari ${r.steps.length}</span><span>${Math.round((i+1)/r.steps.length*100)}%</span></div><div class="progress" role="progressbar" aria-label="Kemajuan langkah" aria-valuemin="0" aria-valuemax="${r.steps.length}" aria-valuenow="${i+1}"><span style="width:${(i+1)/r.steps.length*100}%"></span></div><div class="cook-step" aria-live="polite"><div class="cook-number">${String(i+1).padStart(2,'0')}</div><h3>${esc(r.steps[i])}</h3></div><div class="cook-footer"><button class="btn secondary" data-prev ${i===0?'disabled':''}>${icon('back')}${esc(CONFIG.uiText.previous)}</button><button class="btn" data-next>${esc(i===r.steps.length-1?CONFIG.uiText.cookDone:CONFIG.uiText.next)}${icon(i===r.steps.length-1?'check':'arrow')}</button></div><button class="text-button" data-detail="${esc(r.id)}">Lihat bahan & resep lengkap</button><p class="cook-tip">${esc(r.texture)}</p></div>`,'cooking')}
function completeCooking(){openDialog(`${dialogTop('Dibuat dengan cinta')}<div class="cook complete">${icon('check')}<h2 id="dialog-title">Satu menu, banyak cinta.</h2><p>Masakan selesai disiapkan. Periksa kembali kematangan, tekstur, dan suhu sebelum menyajikannya untuk si kecil.</p><button class="btn" data-detail="${esc(state.recipe)}">Kembali ke resep ${icon('arrow')}</button><button class="text-button" data-close>Selesai</button></div>`,'complete')}
function openPicker(slot){checkDate();state.slot=slot;state.pickQuery='';openDialog(`${dialogTop('Menu Hari Ini')}<div class="picker"><h2 id="dialog-title">Pilih menu ${esc(slot.toLowerCase())}</h2><p>Semua resep tersedia. Pilih sesuai bahan, tekstur, dan kebutuhan anak.</p>${CONFIG.features.search?`<div class="searchbox">${icon('search')}<label class="sr-only" for="pick-search">Cari resep untuk ${esc(slot)}</label><input id="pick-search" type="search" placeholder="${esc(CONFIG.uiText.searchPlaceholder)}" autocomplete="off"></div>`:''}<div id="picker-count" role="status" class="result-count"></div><div class="picker-list" id="picker-list"></div></div>`,'picker');renderPickerList()}
function renderPickerList(){const list=CONFIG.recipes.filter(r=>match(r,state.pickQuery,{}));$('#picker-count').textContent=`${list.length} resep tersedia`;$('#picker-list').innerHTML=list.length?list.map(r=>`<button class="pick-row" data-pick="${esc(r.id)}"><span class="pick-thumb">${foodArt(r)}</span><span class="pick-name">${esc(r.name)}<small>${esc(r.age)} · ${esc(r.category)} · ${r.cookingTime} menit</small></span>${icon(state.plan[state.slot]===r.id?'check':'plus')}</button>`).join(''):`<div class="empty"><h3>${esc(CONFIG.uiText.noResults)}</h3><p>${esc(CONFIG.uiText.noResultsDescription)}</p></div>`}
function openSlots(){openDialog(`${dialogTop('Menu Hari Ini')}<div class="picker"><h2 id="dialog-title">Untuk waktu makan apa?</h2><p>${esc(recipe(state.recipe).name)} · Pilih slot untuk menyimpan resep ini.</p><div class="picker-list">${CONFIG.meals.map(m=>`<button class="pick-row" data-assign="${esc(m)}">${icon('calendar')}<span class="pick-name">${esc(m)}<small>${state.plan[m]?'Ganti '+esc(recipe(state.plan[m])?.name||'menu sebelumnya'):'Belum memilih menu'}</small></span>${icon('plus')}</button>`).join('')}</div></div>`,'slots')}
function assignPlan(slot,id){checkDate();if(!CONFIG.meals.includes(slot)||!recipe(id))return;state.plan[slot]=id;savePlan();closeDialog();if(state.page==='today'){renderMealPlan();observe()}toast(`Menu ${slot.toLowerCase()} tersimpan.`)}
function showSafety(){openDialog(`${dialogTop('Catatan untuk orang tua')}<div class="dialog-inner"><h2 id="dialog-title">Makan nyaman, tumbuh bersama.</h2>${CONFIG.safetyNotes.map(n=>`<section class="detail-section"><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p></section>`).join('')}<p class="detail-safety">${esc(CONFIG.app.disclaimer)}</p></div><div class="dialog-actions"><button class="btn" data-close>Sudah dibaca ${icon('check')}</button></div>`,'safety')}
// Satu listener delegasi untuk setiap jenis event.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.nav){navigate(b.dataset.nav);return}
 if(b.dataset.fav){updateFavorites(b.dataset.fav);return}
 if(b.dataset.detail){openDetail(b.dataset.detail);return}
 if(b.hasAttribute('data-close')){closeDialog();return}
 if(b.hasAttribute('data-random')){randomize();renderRandomRecipes();toast('Pilihan menu baru sudah siap.');return}
 if(b.hasAttribute('data-explore')){if(CONFIG.features.randomMenu)$('#recommendations')?.scrollIntoView({behavior:'smooth',block:'start'});else{navigate('recipes');$('#search')?.focus({preventScroll:true})}return}
 if(b.dataset.filter){state.filters[b.dataset.filter]=b.dataset.value;renderRecipes();return}
 if(b.dataset.category){state.query='';state.filters={age:'',mealTime:'',protein:'',category:'',tag:''};state.filters[b.dataset.field]=b.dataset.category;navigate('recipes');return}
 if(b.hasAttribute('data-reset')){state.query='';Object.keys(state.filters).forEach(k=>state.filters[k]='');if($('#search'))$('#search').value='';renderRecipes();return}
 if(b.hasAttribute('data-clear-search')){state.query='';$('#search').value='';renderRecipes();$('#search').focus();return}
 if(b.hasAttribute('data-safety')){showSafety();return}
 if(b.hasAttribute('data-cook')&&CONFIG.features.cookingMode){state.step=0;renderCooking();return}
 if(b.hasAttribute('data-next')){if(state.step<recipe(state.recipe).steps.length-1){state.step++;renderCooking();dialog.querySelector('[data-next]').focus({preventScroll:true})}else completeCooking();return}
 if(b.hasAttribute('data-prev')){state.step=Math.max(0,state.step-1);renderCooking();const prev=dialog.querySelector('[data-prev]');(prev.disabled?dialog.querySelector('[data-next]'):prev).focus({preventScroll:true});return}
 if(b.dataset.slot&&CONFIG.features.mealPlan){openPicker(b.dataset.slot);return}
 if(b.dataset.pick){assignPlan(state.slot,b.dataset.pick);return}
 if(b.hasAttribute('data-add-plan')&&CONFIG.features.mealPlan){checkDate();openSlots();return}
 if(b.dataset.assign){assignPlan(b.dataset.assign,state.recipe);return}
 if(b.dataset.removeSlot){delete state.plan[b.dataset.removeSlot];savePlan();renderMealPlan();observe();toast('Menu dihapus dari rencana hari ini.');return}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;renderRecipes()}if(e.target.id==='pick-search'){state.pickQuery=e.target.value;renderPickerList()}});
document.addEventListener('change',e=>{if(!e.target.matches('[data-check]'))return;const id=state.recipe,i=Number(e.target.dataset.check),set=new Set(checkedFor(id));e.target.checked?set.add(i):set.delete(i);state.checks[id]=[...set];save('checks',state.checks);$('#ingredient-count').textContent=`${set.size}/${recipe(id).ingredients.length} siap`});
window.addEventListener('scroll',()=>$('#topbar').classList.toggle('scrolled',scrollY>15),{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&checkDate()&&state.page==='today'){renderMealPlan();observe()}});
window.addEventListener('focus',()=>{if(checkDate()&&state.page==='today'){renderMealPlan();observe()}});
for(const [key,value]of Object.entries(CONFIG.theme))document.documentElement.style.setProperty('--'+key,value);
document.title=CONFIG.app.name+' — '+CONFIG.app.tagline;
document.querySelector('meta[name="theme-color"]').content=CONFIG.theme.background;
$('#brand-name').textContent=CONFIG.app.name;$('#brand-tagline').textContent=CONFIG.app.tagline;
randomize();renderFooter();renderPage();
</script>
</body>
</html>
