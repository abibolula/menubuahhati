  safetyNotes:[{title:'Usia adalah panduan, bukan perlombaan',body:'MPASI umumnya dimulai sekitar usia 6 bulan saat anak siap. Label usia di aplikasi membantu pencarian; kemampuan makan setiap anak dapat berbeda. Resep ini tidak menggantikan saran dokter anak.'},{title:'Kenali bahan dan alergen',body:'Perkenalkan alergen baru satu per satu dalam jumlah kecil. Untuk resep dengan beberapa alergen, gunakan bahan yang sudah dikenalkan dan ditoleransi. Periksa label kemasan, termasuk gandum, telur, susu, ikan, kedelai, dan kacang. Jika anak memiliki alergi atau eksim, diskusikan pengenalan alergen dengan tenaga kesehatan.'},{title:'Tekstur yang aman',body:'Dampingi anak duduk tegak. Buang semua duri dan tulang, masak sayur sampai lunak, dan hindari makanan keras, bulat, atau lengket. Potongan untuk digenggam harus lunak dan disesuaikan dengan kemampuan anak.'},{title:'Sederhana tanpa tambahan berlebihan',body:'Jangan berikan madu sebelum usia 12 bulan. Tidak perlu menambahkan garam atau gula. Gunakan susu dan keju pasteurisasi; susu sapi pada resep hanya sebagai bahan masakan, bukan minuman utama sebelum 12 bulan.'},{title:'Simpan porsi yang belum disajikan',body:'Pisahkan porsi simpan sebelum makan. Dinginkan makanan segera dan masukkan ke kulkas; khusus nasi, dalam 1 jam. Ikuti catatan di setiap resep, panaskan hanya sekali, dan buang sisa dari mangkuk anak.'}],

function isHosted(){return location.protocol==='https:'||(location.protocol==='http:'&&['localhost','127.0.0.1','[::1]'].includes(location.hostname))}

function syncInstallUI(){document.querySelectorAll('[data-install]').forEach(b=>{b.disabled=installBusy;b.hidden=!installEnabled()||isStandalone()||installDetected});document.querySelectorAll('.install-banner').forEach(el=>{el.hidden=!installEnabled()||isStandalone()||installDetected})}
function platform(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)?'ios':/Android/i.test(navigator.userAgent)?'android':'android'}
function showInstallHelp(selected=platform()){
 const local=!/^https?:$/.test(location.protocol),secure=isHosted();
 const installed=isStandalone()||installDetected;
 const instructions=selected==='ios'?CONFIG.install.ios:CONFIG.install.android;
 const name=CONFIG.app.name;

ton></div>`,'install');
}
async function requestInstall(){
 if(!installEnabled()||installBusy)return;
 if(isStandalone()||installDetected){showInstallHelp();return}
 if(!installPromptEvent||!isHosted()){showInstallHelp();return}
 const pending=installPromptEvent;installPromptEvent=null;installBusy=true;syncInstallUI();
 try{
   await pending.prompt();
   const choice=await pending.userChoice;
   if(choice.outcome==='accepted'){
     if(dialog.open&&state.dialogMode==='install')closeDialog();
     toast('Permintaan pemasangan diterima. Ikuti konfirmasi dari browser.');
   }else toast('Pemasangan dibatalkan. Anda tetap bisa memasang lewat menu browser.');
 }catch{showInstallHelp();toast('Gunakan menu browser untuk menambahkan ke layar utama.');}
 finally{installBusy=false;syncInstallUI();if(dialog.open&&state.dialogMode==='install')showInstallHelp();}
}
function setupInstall(){
 const config=CONFIG.install;
 document.querySelector('meta[name="apple-mobile-web-app-title"]').content=config.shortName||CONFIG.app.name;
 document.querySelector('meta[name="application-name"]').content=CONFIG.app.name;
 if(installEnabled()&&isHosted()){
   // URL absolut diperlukan karena manifest disematkan sebagai data URL.
   const base=new URL('./',location.href);
   const icon192=document.querySelector('#app-icon-192').href;
   const icon512=document.querySelector('#app-icon-512').href;
   const manifest={id:new URL(config.id,base).href,name:CONFIG.app.name,short_name:config.shortName,description:CONFIG.app.subheadline,lang:'id',dir:'ltr',start_url:new URL('index.html',base).href,scope:base.href,display:'standalone',background_color:CONFIG.theme.background,theme_color:CONFIG.theme.primary,prefer_related_applications:false,icons:[{src:icon192,sizes:'192x192',type:'image/png',purpose:'any'},{src:icon512,sizes:'512x512',type:'image/png',purpose:'any'},{src:icon512,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
   const link=document.createElement('link');link.rel='manifest';link.id='app-manifest';link.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(manifest));document.head.appendChild(link);
 }
 window.addEventListener('beforeinstallprompt',e=>{if(!installEnabled())return;e.preventDefault();installPromptEvent=e;syncInstallUI();if(dialog.open&&state.dialogMode==='install')showInstallHelp()});
 window.addEventListener('appinstalled',()=>{installPromptEvent=null;installDetected=true;syncInstallUI();if(dialog.open&&state.dialogMode==='install')closeDialog();toast('Aplikasi berhasil dipasang. Temukan Menu Buah Hati di layar utama.')});
 standaloneQuery.addEventListener?.('change',syncInstallUI);
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.hasAttribute('data-install')||b.hasAttribute('data-install-native'))requestInstall();if(b.dataset.installPlatform)showInstallHelp(b.dataset.installPlatform)});
 syncInstallUI();
}

// ---------- Filter alergi global. Pilihan disimpan hanya di perangkat ini. ----------
// allergyTags opsional pada resep memakai ID CONFIG.allergy.options.
// Pencocokan bahan/catatan tetap berjalan untuk resep baru yang belum diberi tag.
function normalizeFood(s){return String(s??'').toLocaleLowerCase('id').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function hasFood(text,phrase){return (' '+normalizeFood(text)+' ').includes(' '+normalizeFood(phrase)+' ')}
function allergyEnabled(){return CONFIG.allergy.enabled}
function cleanAllergies(raw){return {ids:new Set(Array.isArray(raw?.ids)?raw.ids.filter(id=>CONFIG.allergy.options.some(o=>o.id===id)):[]),fruits:new Set(Array.isArray(raw?.fruits)?raw.fruits.filter(id=>CONFIG.allergy.fruits.some(f=>f.id===id)):[])}}
const foodTagCache=new WeakMap();
let allergyState=cleanAllergies(read('allergies',{})),allergyDraft=null;
function recipeAllergyTags(r){
 if(foodTagCache.has(r))return foodTagCache.get(r);
 const tags=new Set(r.allergyTags||[]),ingredients=(r.ingredients||[]).map(i=>i.name),notes=Array.isArray(r.allergens)?r.allergens:[];
 for(const option of CONFIG.allergy.options){
   if(option.id==='fruit')continue;
   if([...ingredients,...notes].some(text=>option.terms.some(term=>hasFood(text,term))))tags.add(option.id);
 }
 // Susu nabati tidak otomatis menjadi susu sapi; istilah "susu" tanpa penjelasan
 // tetap dikecualikan secara konservatif. Telur ayam bukan daging ayam.
 for(const ingredient of ingredients){const text=normalizeFood(ingredient);
   if(hasFood(text,'susu')&&!/kedelai|soya|almond|oat|kelapa|santan|beras|mete|mede|kacang/.test(text))tags.add('milk');
 }
 if(ingredients.some(text=>hasFood(text,'ayam')&&!hasFood(text,'telur')))tags.add('chicken');
 if(notes.some(text=>normalizeFood(text)==='ayam'))tags.add('chicken');
 if(notes.some(text=>normalizeFood(text)==='susu'))tags.add('milk');
 foodTagCache.set(r,tags);
 return tags;
}
function recipeFruits(r){const text=(r.ingredients||[]).map(i=>i.name).join(' | ');return [...new Set([...(r.fruitTags||[]),...CONFIG.allergy.fruits.filter(f=>f.terms.some(term=>hasFood(text,term))).map(f=>f.id)])]}
function allergyConflicts(r,selection=allergyState){
 if(!allergyEnabled()||selection.ids.size===0)return [];
 const tags=recipeAllergyTags(r),blocked=[];
 for(const id of selection.ids){
   if(id==='fruit'){const fruits=recipeFruits(r);if((tags.has('fruit')&&selection.fruits.size===0)||fruits.some(f=>selection.fruits.size===0||selection.fruits.has(f)))blocked.push(id)}
   else if(tags.has(id))blocked.push(id);
 }
 return blocked;
}
function allowedRecipe(r){return Boolean(r)&&allergyConflicts(r).length===0}
function eligibleRecipes(){return CONFIG.recipes.filter(allowedRecipe)}
function allergyNames(selection=allergyState){return CONFIG.allergy.options.filter(o=>selection.ids.has(o.id)).map(o=>o.id==='fruit'&&selection.fruits.size?CONFIG.allergy.fruits.filter(f=>selection.fruits.has(f.id)).map(f=>f.label).join(', '):o.short)}
function allergyMarkup(){if(!allergyEnabled())return '';const active=allergyState.ids.size>0,hidden=CONFIG.recipes.length-eligibleRecipes().length;return `<aside class="allergy-toolbar ${active?'is-active':''}" aria-label="Filter alergi"><div class="allergy-toolbar-head"><button class="btn ${active?'':'secondary'}" data-allergy-open>${icon('shield')}Filter alergi${active?`<span class="allergy-count">${allergyState.ids.size}</span>`:''}</button><span class="allergy-status">${active?`${hidden} resep disembunyikan`:'Sesuaikan dengan bahan yang dihindari'}</span>${active?'<button class="text-button" data-allergy-clear>Nonaktifkan</button>':''}</div>${active?`<p class="allergy-selected">Dihindari: <strong>${esc(allergyNames().join(' · '))}</strong></p>`:''}<p class="allergy-caption">${esc(CONFIG.allergy.shortNote)}</p></aside>`}
function allergyEmpty(){return `<div class="empty">${icon('shield')}<h3>Belum ada resep yang cocok</h3><p>Resep yang memuat bahan pilihan Anda disembunyikan. Filter alergi tetap aktif saat pencarian direset.</p><button class="btn secondary" data-allergy-open>Atur filter alergi</button></div>`}
function openAllergySettings(){allergyDraft={ids:new Set(allergyState.ids),fruits:new Set(allergyState.fruits)};renderAllergySettings()}
function renderAllergySettings(focusSelector){
 const scroll=state.dialogMode==='allergies'?dialog.scrollTop:0,draft=allergyDraft;
 const excluded=CONFIG.recipes.filter(r=>allergyConflicts(r,draft).length>0).length;
 const fruitOn=draft.ids.has('fruit');
 openDialog(`${dialogTop('Preferensi bahan si kecil')}<div class="dialog-inner allergy-settings"><p class="eyebrow">Kenali bahan, pilih dengan perhatian</p><h2 id="dialog-title">Bahan apa yang dihindari?</h2><p>Pilih satu atau beberapa kategori. Resep yang mengandung salah satunya akan disembunyikan di seluruh aplikasi.</p><div class="allergy-options" role="group" aria-label="Kategori alergi">${CONFIG.allergy.options.map(o=>{const chosen=draft.ids.has(o.id);const single={ids:new Set([o.id]),fruits:new Set()};const count=CONFIG.recipes.filter(r=>allergyConflicts(r,single).length).length;return `<button class="allergy-option ${chosen?'active':''}" data-allergy-id="${o.id}" aria-pressed="${chosen}"><span class="allergy-tick">${chosen?icon('check'):''}</span><span><strong>${esc(o.label)}</strong><small>${esc(o.description)}</small></span><span class="allergy-total">${count}</span></button>`}).join('')}</div><section class="fruit-options" ${fruitOn?'':'hidden'}><h3>Pilih jenis buah</h3><p>${draft.fruits.size?'Hanya buah yang dipilih di bawah ini dikecualikan.':'Semua buah dalam daftar difilter. Pilih jenis tertentu untuk mempersempitnya.'}</p><div class="fruit-chips" role="group" aria-label="Jenis buah"><button class="chip ${draft.fruits.size?'':'active'}" data-fruit-all aria-pressed="${!draft.fruits.size}">Semua buah di daftar</button>${CONFIG.allergy.fruits.map(f=>`<button class="chip ${draft.fruits.has(f.id)?'active':''}" data-fruit-id="${f.id}" aria-pressed="${draft.fruits.has(f.id)}">${esc(f.label)}</button>`).join('')}</div></section><div class="allergy-preview" role="status" aria-live="polite"><strong>${CONFIG.recipes.length-excluded} resep ditampilkan</strong><span>${excluded} dari ${CONFIG.recipes.length} resep disembunyikan</span></div><p class="allergy-disclaimer">${esc(CONFIG.allergy.note)}</p><button class="text-button" data-allergy-draft-clear>Kosongkan pilihan</button></div><div class="dialog-actions"><button class="btn secondary" data-close>Batal</button><button class="btn" data-allergy-apply>${icon('check')}Terapkan filter</button></div>`,'allergies');
 dialog.scrollTop=scroll;
 if(focusSelector)dialog.querySelector(focusSelector)?.focus({preventScroll:true});
}
function applyAllergies(selection){
 allergyState={ids:new Set(selection.ids),fruits:new Set(selection.fruits)};
 if(!allergyState.ids.has('fruit'))allergyState.fruits.clear();
 save('allergies',{ids:[...allergyState.ids],fruits:[...allergyState.fruits]});
 if(dialog.open)closeDialog();
 randomize();renderPage();syncInstallUI();
 toast(allergyState.ids.size?'Filter alergi diterapkan di seluruh menu.':'Filter alergi dinonaktifkan.');
 const toolbar=main.querySelector('[data-allergy-open]');toolbar?.focus({preventScroll:true});
}
function handleAllergyButton(b){
 if(!allergyEnabled())return false;
 if(b.hasAttribute('data-allergy-open')){openAllergySettings();return true}
 if(b.hasAttribute('data-allergy-clear')){applyAllergies({ids:new Set(),fruits:new Set()});return true}
 if(b.hasAttribute('data-allergy-apply')){applyAllergies(allergyDraft);return true}
 if(b.hasAttribute('data-allergy-draft-clear')){allergyDraft.ids.clear();allergyDraft.fruits.clear();renderAllergySettings('[data-allergy-draft-clear]');return true}
 if(b.dataset.allergyId){const id=b.dataset.allergyId;allergyDraft.ids.has(id)?allergyDraft.ids.delete(id):allergyDraft.ids.add(id);renderAllergySettings(`[data-allergy-id="${id}"]`);return true}
 if(b.hasAttribute('data-fruit-all')){allergyDraft.fruits.clear();renderAllergySettings('[data-fruit-all]');return true}
 if(b.dataset.fruitId){const id=b.dataset.fruitId;allergyDraft.fruits.has(id)?allergyDraft.fruits.delete(id):allergyDraft.fruits.add(id);renderAllergySettings(`[data-fruit-id="${id}"]`);return true}
 return false;
}

const validIds=new Set(CONFIG.recipes.map(r=>r.id));
for(const slot of Object.keys(state.plan))if(!CONFIG.meals.includes(slot)||!validIds.has(state.plan[slot]))delete state.plan[slot];
function recipe(id){return CONFIG.recipes.find(r=>r.id===id)}

function primaryIngredients(r){return r.mainIngredients||r.ingredients.slice(0,3).map(i=>i.name)}
let toastTimer;
function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3400)}
const observer='IntersectionObserver' in window?new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}},{threshold:.04}):null;
function observe(){document.querySelectorAll('.reveal:not(.visible)').forEach(el=>observer?observer.observe(el):el.classList.add('visible'))}
function navItems(){return [['home','home',CONFIG.uiText.home],['recipes','book',CONFIG.uiText.recipes],...(CONFIG.features.mealPlan?[['today','calendar',CONFIG.uiText.today]]:[]),...(CONFIG.features.favorites?[['favorites','bookmark',CONFIG.uiText.favorites]]:[])]}

function card(r,index=0){const saved=state.favorites.has(r.id),number=CONFIG.recipes.indexOf(r)+1;const bg=['#e9eadd','#f0e1d0','#e4e8df','#efdfd6'][number%4];return `<article class="recipe-card" data-card-recipe="${esc(r.id)}" style="--i:${index%4};--art-bg:${bg}"><div class="card-art"><span class="recipe-number">recette / ${String(number).padStart(2,'0')}</span>${foodArt(r)}</div>${CONFIG.features.favorites?`<button class="icon-button bookmark ${saved?'saved':''}" data-fav="${esc(r.id)}" aria-label="${saved?'Hapus':'Simpan'} ${esc(r.name)} ${saved?'dari':'ke'} favorit" aria-pressed="${saved}">${icon('bookmark')}</button>`:''}<div class="card-content"><p class="category-label">${esc(r.category)}</p><h3 class="card-title"><button data-detail="${esc(r.id)}">${esc(r.name)}</button></h3><div class="card-meta"><span class="age-label">${esc(r.age)}</span>${icon('clock')}<span>${r.cookingTime} menit</span></div><p class="card-ingredients">${primaryIngredients(r).map(esc).join(' · ')}</p><div class="card-bottom"><span>${esc(difficulty(r))}</span><span>${esc(CONFIG.uiText.viewRecipe)} ${icon('arrow')}</span></div></div></article>`}
function randomize(){const eligible=eligibleRecipes(),other=eligible.filter(r=>!state.random.includes(r.id)),pool=other.length>=Math.min(4,eligible.length)?other:[...eligible];for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}state.random=pool.slice(0,4).map(r=>r.id)}

function searchMarkup(){return CONFIG.features.search?`<div class="searchbox">${icon('search')}<label for="search" class="sr-only">${esc(CONFIG.uiText.searchPlaceholder)}</label><input id="search" type="search" autocomplete="off" placeholder="${esc(CONFIG.uiText.searchPlaceholder)}" value="${esc(state.query)}"><button class="icon-button" data-clear-search aria-label="Hapus pencarian" ${state.query?'':'hidden'}>${icon('close')}</button></div>`:''}
function values(field,initial){return [...new Set([...initial,...CONFIG.recipes.flatMap(r=>Array.isArray(r[field])?r[field]:[r[field]]).filter(Boolean)])]}
function filterRow(field,label,options){return `<div class="filter-row"><span class="filter-label" id="label-${field}">${label}</span><div class="chips" role="group" aria-labelledby="label-${field}">${['',...options].map(v=>`<button class="chip ${state.filters[field]===v?'active':''}" data-filter="${field}" data-value="${esc(v)}" aria-pressed="${state.filters[field]===v}">${esc(v||'Semua')}</button>`).join('')}</div></div>`}
function renderFilters(){return CONFIG.features.filters?`${filterRow('mealTime','Waktu',values('mealTime',CONFIG.meals))}${filterRow('protein','Protein',values('protein',CONFIG.proteins))}${filterRow('category','Jenis',values('category',CONFIG.types))}<div class="filter-summary"><span id="filter-count"></span><button class="reset" data-reset>${esc(CONFIG.uiText.clearFilters)}</button></div>`:''}
function ageFilter(){return CONFIG.features.filters?filterRow('age','Usia',values('age',CONFIG.ages)):''}
function match(r,q,filters){const normal=x=>String(x??'').toLocaleLowerCase('id').normalize('NFD').replace(/[\u0300-\u036f]/g,'');const hay=normal([r.name,r.category,r.age,r.protein,r.mealTime,...(r.tags||[]),...r.ingredients.map(i=>i.name)].join(' '));return normal(q).trim().split(/\s+/).every(term=>hay.includes(term))&&Object.entries(filters).every(([key,val])=>!val||(key==='tag'?(r.tags||[]).includes(val):Array.isArray(r[key])?r[key].includes(val):r[key]===val))}
function filtered(){return CONFIG.recipes.filter(r=>allowedRecipe(r)&&match(r,CONFIG.features.search?state.query:'',CONFIG.features.filters?state.filters:{}))}

function renderRecipes(){const el=$('#recipe-grid');if(!el)return;const searching=(CONFIG.features.search&&state.query.trim())||(CONFIG.features.filters&&Object.values(state.filters).some(Boolean));['#recommendations','#categories-section'].forEach(sel=>{const section=$(sel);if(section)section.hidden=Boolean(searching)});const rs=filtered();el.innerHTML=rs.length?rs.map(card).join(''):empty('search');$('#result-count').textContent=`${rs.length} dari ${CONFIG.recipes.length} resep`;if($('#filter-count')){const count=Object.values(state.filters).filter(Boolean).length;$('#filter-count').textContent=count?`${count} filter aktif${state.filters.tag?' · '+state.filters.tag:''}`:'Semua rasa, semua kemungkinan';$('#filter-count').nextElementSibling.hidden=!count&&!state.query}const clear=$('[data-clear-search]');if(clear){clear.hidden=!state.query;clear.setAttribute('aria-label','Hapus pencarian')}document.querySelectorAll('[data-filter]').forEach(b=>{const active=state.filters[b.dataset.filter]===b.dataset.value;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)})}
function collection(){return `<section class="section collection" id="collection"><div class="section-head"><div><h2>${esc(CONFIG.uiText.collection)}</h2><p>Resep sederhana untuk cerita makan yang berwarna.</p></div><span class="result-count" id="result-count" role="status" aria-live="polite"></span></div><div class="filter-panel">${renderFilters()}</div><div class="grid" id="recipe-grid"></div></section>`}
function tipsBanner(){return `<aside class="tips-banner reveal">${icon('leaf')}<div><h3>${esc(CONFIG.uiText.tipTitle)}</h3><p>${esc(CONFIG.uiText.tipBody)}</p></div><button class="text-button" data-safety>${esc(CONFIG.uiText.tipAction)} ${icon('arrow')}</button></aside>`}
function renderHome(){const hour=new Date().getHours(),greeting=hour<11?'Selamat pagi':hour<15?'Selamat siang':hour<18?'Selamat sore':'Selamat malam';const title=esc(CONFIG.app.heroTitle).replace('Makan Apa?','<em>Makan Apa?</em>');main.innerHTML=`<div class="page"><section class="hero"><div class="hero-copy"><div class="greeting">${icon(hour<18?'sun':'moon')} ${greeting}, orang tua hebat.</div><span class="eyebrow">Resep kecil untuk tumbuh bersama</span><h1>${title}</h1><p>${esc(CONFIG.app.heroSubtitle)}</p><div class="hero-actions"><button class="btn" data-explore>${esc(CONFIG.uiText.explore)} ${icon('arrow')}</button><button class="btn secondary" data-nav="recipes">${esc(CONFIG.uiText.allRecipes)}</button></div><div class="hero-footnote">${icon('heart')}<span>${CONFIG.recipes.length} inspirasi menu</span><span>·</span><span>Diracik dengan penuh perhatian</span></div></div><div class="hero-art">${heroArt()}</div></section>${installBanner()}<section class="search-area" aria-label="Cari inspirasi resep">${searchMarkup()}${ageFilter()}${allergyMarkup()}</section>${CONFIG.features.randomMenu?`<section class="section" id="recommendations"><div class="section-head"><div><h2>${esc(CONFIG.uiText.recommendations)}</h2><p>Sedikit inspirasi untuk meja makan si kecil.</p></div><button class="text-button" data-random>${icon('shuffle')}${esc(CONFIG.uiText.randomMenu)}</button></div><div class="grid recommendations" id="random-grid"></div></section>`:''}${CONFIG.features.filters?`<section class="section reveal" id="categories-section"><div class="section-head"><div><h2>${esc(CONFIG.uiText.categories)}</h2><p>Mulai dari bahan atau menu kesukaan si kecil.</p></div></div><div class="categories">${CONFIG.categories.map(c=>`<button class="category-tile" data-category="${esc(c.value)}" data-field="${esc(c.field)}">${icon(c.icon)}${esc(c.label)}</button>`).join('')}</div></section>`:''}${collection()}${tipsBanner()}</div>`;renderRandomRecipes();renderRecipes()}
function renderRecipePage(){main.innerHTML=`<div class="page"><div class="page-heading"><span class="eyebrow">Buku resep keluarga</span><h1>Temukan menu kesukaan.</h1><p>${esc(CONFIG.app.subheadline)}</p></div><section class="search-area">${searchMarkup()}${ageFilter()}${allergyMarkup()}</section>${collection()}${tipsBanner()}</div>`;renderRecipes()}
function renderFavorites(){const all=CONFIG.recipes.filter(r=>state.favorites.has(r.id)),visible=all.filter(allowedRecipe),hidden=all.length-visible.length;main.innerHTML=`<div class="page"><div class="page-heading"><span class="eyebrow">Disimpan dengan cinta</span><h1>Menu Favorit</h1><p>${all.length} resep tersimpan untuk dimasak kembali.</p></div>${allergyMarkup()}${hidden?`<p class="favorite-hidden-note">${hidden} favorit disembunyikan oleh filter alergi. Resep tetap tersimpan.</p>`:''}<section class="grid" id="favorite-grid">${visible.map(card).join('')||(hidden?allergyEmpty():empty('favorite'))}</section></div>`}
function checkDate(){if(state.date!==dateKey()){state.date=dateKey();state.plan={};savePlan();return true}return false}
function savePlan(){save('plan',{date:state.date,slots:state.plan})}
function renderMealPlan(){checkDate();const count=CONFIG.meals.filter(m=>allowedRecipe(recipe(state.plan[m]))).length;main.innerHTML=`<div class="page"><div class="page-heading"><span class="eyebrow">Catatan makan si kecil</span><h1>Menu Hari Ini</h1><p>${count?`${count} dari ${CONFIG.meals.length} waktu makan sudah direncanakan. Pilihan sederhana, hari yang lebih tenang.`:esc(CONFIG.uiText.planEmpty)+'. '+esc(CONFIG.uiText.planDescription)}</p></div>${allergyMarkup()}<div class="plan-date">${icon('calendar')}${new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}</div><section class="plan-grid">${CONFIG.meals.map((slot,i)=>{const stored=recipe(state.plan[slot]),r=allowedRecipe(stored)?stored:null,blocked=Boolean(stored&&!r);return `<article class="plan-slot"><div class="slot-heading">${icon(['sun','bowl','moon','cake'][i%4])}<h2>${esc(slot)}</h2><small>${r?'Sudah dipilih':blocked?'Disembunyikan':'Belum diisi'}</small></div>${r?`<div class="plan-recipe"><div class="plan-art">${foodArt(r)}</div><div><h3>${esc(r.name)}</h3><p>${esc(r.age)} · ${r.cookingTime} menit</p></div></div><div class="slot-actions"><button class="text-button" data-detail="${esc(r.id)}">${esc(CONFIG.uiText.viewRecipe)} ${icon('arrow')}</button><button class="text-button" data-slot="${esc(slot)}">Ganti menu</button><button class="text-button remove" data-remove-slot="${esc(slot)}" aria-label="Hapus menu ${esc(slot)}">${icon('trash')} Hapus</button></div>`:`${blocked?'<p class="blocked-slot">Menu tersimpan memuat bahan yang sedang dihindari. Pilih menu pengganti atau ubah filter alergi.</p>':''}<button class="slot-empty" data-slot="${esc(slot)}">${esc(CONFIG.uiText.chooseMenu)}</button>`}</article>`}).join('')}</section><p class="notice">Rencana disimpan untuk tanggal hari ini di browser ini dan dikosongkan saat berganti hari. Pilih menu sesuai kebutuhan; tidak semua slot harus diisi.</p>${tipsBanner()}</div>`}
function renderFooter(){const a=CONFIG.app;$('#footer').innerHTML=`<div class="footer"><div class="serif">${esc(a.tagline)}</div><p class="brand-subheadline">${esc(a.subheadline)}</p><p>${esc(a.disclaimer)} Kebutuhan setiap anak dapat berbeda; aplikasi ini tidak menggantikan saran dokter anak.</p><details><summary>Rujukan keamanan makanan</summary><p>Rujukan untuk catatan keamanan umum, bukan validasi setiap resep. Tautan membutuhkan internet; fitur aplikasi tetap bisa digunakan offline.</p>${CONFIG.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.label)}</a>`).join('')}</details><p>${esc(a.name)} · Buku kecil, banyak cinta.</p>${installEnabled()?`<button class="text-button footer-install" data-install>${icon('download')}${esc(CONFIG.install.button)}</button>`:''}</div>`}
function renderPage(){if(observer)observer.disconnect();renderNav();({home:renderHome,recipes:renderRecipePage,today:renderMealPlan,favorites:renderFavorites}[state.page]||renderHome)();observe()}
function navigate(page){if(!navItems().some(n=>n[0]===page))page='home';state.scrollPositions[state.page]=scrollY;state.page=page;renderPage();window.scrollTo({top:0,behavior:'instant'});main.focus({preventScroll:true})}
function updateFavorites(id){if(!CONFIG.features.favorites||!recipe(id))return;const saved=!state.favorites.has(id);saved?state.favorites.add(id):state.favorites.delete(id);save('favorites',[...state.favorites]);renderNav();document.querySelectorAll('[data-fav]').forEach(b=>{if(b.dataset.fav!==id)return;b.classList.toggle('saved',saved);b.setAttribute('aria-pressed',saved);b.setAttribute('aria-label',`${saved?'Hapus':'Simpan'} ${recipe(id).name} ${saved?'dari':'ke'} favorit`)});if(state.page==='favorites'){renderFavorites();if(!dialog.open)main.focus({preventScroll:true})}toast(saved?'Resep disimpan ke favorit.':'Resep dihapus dari favorit.')}
function openDialog(html,mode){state.dialogMode=mode;if(!dialog.open){state.lastFocus=document.activeElement;document.body.style.overflow='hidden'}dialog.innerHTML=html;if(!dialog.open)dialog.showModal();dialog.scrollTop=0;const focus=dialog.querySelector('input[type="search"]')||dialog.querySelector('[data-close]');if(focus)focus.focus({preventScroll:true})}
function dialogTop(label){return `<div class="dialog-top"><span>${esc(label)}</span><button class="icon-button" data-close aria-label="Tutup">${icon('close')}</button></div>`}
function closeDialog(){dialog.close()}
dialog.addEventListener('close',()=>{document.body.style.overflow='';if(state.lastFocus?.isConnected)state.lastFocus.focus({preventScroll:true});else main.focus({preventScroll:true});state.dialogMode=''});
let backdropDown=false;dialog.addEventListener('pointerdown',e=>{const r=dialog.getBoundingClientRect();backdropDown=e.target===dialog&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)});dialog.addEventListener('click',e=>{if(backdropDown&&e.target===dialog)closeDialog();backdropDown=false});
function checkedFor(id){return Array.isArray(state.checks[id])?state.checks[id]:[]}
function openDetail(id){const r=recipe(id);if(!r)return;if(!allowedRecipe(r)){toast('Resep ini disembunyikan oleh filter alergi.');return}state.recipe=id;const checked=checkedFor(id);openDialog(`${dialogTop('Buku resep · '+String(CONFIG.recipes.indexOf(r)+1).padStart(2,'0'))}<div class="dialog-inner"><div class="detail-heading"><div class="detail-art">${foodArt(r)}</div><div><p class="category-label">${esc(r.category)} · ${esc(r.mealTime)}</p><h2 id="dialog-title">${esc(r.name)}</h2><div class="detail-meta"><span>${esc(r.age)}</span><span>${r.cookingTime} menit</span><span>${esc(difficulty(r))}</span></div></div></div><p class="portion">${esc(r.portion||CONFIG.recipeDefaults.portion)} Waktu memasak adalah perkiraan, termasuk persiapan dasar; lanjutkan hingga bahan benar-benar matang.</p><section class="detail-section"><h3>Bahan <span class="ingredient-count" id="ingredient-count">${checked.filter(i=>Number.isInteger(i)&&i>=0&&i<r.ingredients.length).length}/${r.ingredients.length} siap</span></h3><ul class="ingredients">${r.ingredients.map((ing,i)=>`<li><label class="ingredient"><input type="checkbox" data-check="${i}" ${checked.includes(i)?'checked':''}><span><strong>${esc(ing.amount)}</strong> ${esc(ing.name)}</span></label></li>`).join('')}</ul></section><section class="detail-section"><h3>Cara Membuat</h3><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section><div class="notes-grid"><section class="note-box"><h4>Tekstur akhir</h4><p>${esc(r.texture)}</p></section><section class="note-box"><h4>Tips penyajian</h4><p>${esc(r.tips)}</p></section><section class="note-box allergy"><h4>Kenali alergen</h4><p>${r.allergens.length?esc(r.allergens.join(', '))+'. Perkenalkan bahan alergen baru satu per satu; gunakan kombinasi yang sudah ditoleransi.':'Tidak ada alergen umum yang teridentifikasi pada bahan yang tercantum. Reaksi individual tetap mungkin terjadi.'} Periksa label bahan kemasan.</p></section><section class="note-box"><h4>Penyimpanan</h4><p>${esc(r.storage||(r.category==='Bubur'||r.category==='Nasi Tim'?CONFIG.recipeDefaults.riceStorage:CONFIG.recipeDefaults.storage))}</p></section></div><div class="detail-safety"><strong>Catatan kecil untuk keamanan</strong><br>${esc(r.safety||CONFIG.recipeDefaults.safety)}<br>Sesuaikan bahan, tekstur, dan porsi dengan kondisi anak.</div></div><div class="dialog-actions">${CONFIG.features.cookingMode?`<button class="btn" data-cook>${icon('chef')}${esc(CONFIG.uiText.startCooking)}</button>`:''}${CONFIG.features.mealPlan?`<button class="btn secondary meal-detail" data-add-plan aria-label="Tambahkan resep ke Menu Hari Ini">${icon('calendar')} Menu Hari Ini</button>`:''}${CONFIG.features.favorites?`<button class="icon-button ${state.favorites.has(id)?'saved':''}" data-fav="${esc(id)}" aria-pressed="${state.favorites.has(id)}" aria-label="${state.favorites.has(id)?'Hapus dari':'Simpan ke'} favorit">${icon('bookmark')}</button>`:''}</div>`,'detail')}
function renderCooking(){const r=recipe(state.recipe);if(!allowedRecipe(r)){closeDialog();return;}const i=state.step;openDialog(`${dialogTop('Cooking mode')}<div class="cook"><h2 id="dialog-title">${esc(r.name)}</h2><div class="cook-label"><span>Langkah ${i+1} dari ${r.steps.length}</span><span>${Math.round((i+1)/r.steps.length*100)}%</span></div><div class="progress" role="progressbar" aria-label="Kemajuan langkah" aria-valuemin="0" aria-valuemax="${r.steps.length}" aria-valuenow="${i+1}"><span style="width:${(i+1)/r.steps.length*100}%"></span></div><div class="cook-step" aria-live="polite"><div class="cook-number">${String(i+1).padStart(2,'0')}</div><h3>${esc(r.steps[i])}</h3></div><div class="cook-footer"><button class="btn secondary" data-prev ${i===0?'disabled':''}>${icon('back')}${esc(CONFIG.uiText.previous)}</button><button class="btn" data-next>${esc(i===r.steps.length-1?CONFIG.uiText.cookDone:CONFIG.uiText.next)}${icon(i===r.steps.length-1?'check':'arrow')}</button></div><button class="text-button" data-detail="${esc(r.id)}">Lihat bahan & resep lengkap</button><p class="cook-tip">${esc(r.texture)}</p></div>`,'cooking')}
function completeCooking(){openDialog(`${dialogTop('Dibuat dengan cinta')}<div class="cook complete">${icon('check')}<h2 id="dialog-title">Satu menu, banyak cinta.</h2><p>Masakan selesai disiapkan. Periksa kembali kematangan, tekstur, dan suhu sebelum menyajikannya untuk si kecil.</p><button class="btn" data-detail="${esc(state.recipe)}">Kembali ke resep ${icon('arrow')}</button><button class="text-button" data-close>Selesai</button></div>`,'complete')}
function openPicker(slot){checkDate();state.slot=slot;state.pickQuery='';openDialog(`${dialogTop('Menu Hari Ini')}<div class="picker"><h2 id="dialog-title">Pilih menu ${esc(slot.toLowerCase())}</h2><p>Pilih sesuai bahan, tekstur, dan kebutuhan anak.</p>${allergyEnabled()&&allergyState.ids.size?`<div class="allergy-picker-note">Filter alergi aktif: ${esc(allergyNames().join(' · '))}. <button class="text-button" data-allergy-open>Ubah</button></div>`:''}${CONFIG.features.search?`<div class="searchbox">${icon('search')}<label class="sr-only" for="pick-search">Cari resep untuk ${esc(slot)}</label><input id="pick-search" type="search" placeholder="${esc(CONFIG.uiText.searchPlaceholder)}" autocomplete="off"></div>`:''}<div id="picker-count" role="status" class="result-count"></div><div class="picker-list" id="picker-list"></div></div>`,'picker');renderPickerList()}
function renderPickerList(){const list=CONFIG.recipes.filter(r=>allowedRecipe(r)&&match(r,state.pickQuery,{}));$('#picker-count').textContent=`${list.length} resep tersedia`;$('#picker-list').innerHTML=list.length?list.map(r=>`<button class="pick-row" data-pick="${esc(r.id)}"><span class="pick-thumb">${foodArt(r)}</span><span class="pick-name">${esc(r.name)}<small>${esc(r.age)} · ${esc(r.category)} · ${r.cookingTime} menit</small></span>${icon(state.plan[state.slot]===r.id?'check':'plus')}</button>`).join(''):`<div class="empty"><h3>${esc(CONFIG.uiText.noResults)}</h3><p>${esc(CONFIG.uiText.noResultsDescription)}</p></div>`}
function openSlots(){openDialog(`${dialogTop('Menu Hari Ini')}<div class="picker"><h2 id="dialog-title">Untuk waktu makan apa?</h2><p>${esc(recipe(state.recipe).name)} · Pilih slot untuk menyimpan resep ini.</p><div class="picker-list">${CONFIG.meals.map(m=>`<button class="pick-row" data-assign="${esc(m)}">${icon('calendar')}<span class="pick-name">${esc(m)}<small>${state.plan[m]?'Ganti '+(allowedRecipe(recipe(state.plan[m]))?esc(recipe(state.plan[m]).name):'menu yang disembunyikan'):'Belum memilih menu'}</small></span>${icon('plus')}</button>`).join('')}</div></div>`,'slots')}
function assignPlan(slot,id){checkDate();if(!CONFIG.meals.includes(slot)||!allowedRecipe(recipe(id))){toast('Menu tidak dapat dipilih karena filter alergi.');return;}state.plan[slot]=id;savePlan();closeDialog();if(state.page==='today'){renderMealPlan();observe()}toast(`Menu ${slot.toLowerCase()} tersimpan.`)}
function showSafety(){openDialog(`${dialogTop('Catatan untuk orang tua')}<div class="dialog-inner"><h2 id="dialog-title">Makan nyaman, tumbuh bersama.</h2>${CONFIG.safetyNotes.map(n=>`<section class="detail-section"><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p></section>`).join('')}<p class="detail-safety">${esc(CONFIG.app.disclaimer)}</p></div><div class="dialog-actions"><button class="btn" data-close>Sudah dibaca ${icon('check')}</button></div>`,'safety')}
// Seluruh kartu membuka detail; tombol favorit ditangani terpisah.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){const card=e.target.closest('[data-card-recipe]');if(card)openDetail(card.dataset.cardRecipe);return;}if(b.disabled)return;
 if(handleAllergyButton(b))return;
 if(b.dataset.nav){navigate(b.dataset.nav);return}
 if(b.dataset.fav){updateFavorites(b.dataset.fav);return}
 if(b.dataset.detail){openDetail(b.dataset.detail);return}
 if(b.hasAttribute('data-close')){closeDialog();return}
 if(b.hasAttribute('data-random')){randomize();renderRandomRecipes();toast('Pilihan menu baru sudah siap.');return}
 if(b.hasAttribute('data-explore')){if(CONFIG.features.randomMenu)$('#recommendations')?.scrollIntoView({behavior:'smooth',block:'start'});else{navigate('recipes');$('#search')?.focus({preventScroll:true})}return}
 if(b.dataset.filter){state.filters[b.dataset.filter]=b.dataset.value;renderRecipes();return}
 if(b.dataset.category){state.query='';state.filters={age:'',mealTime:'',protein:'',category:'',tag:''};state.filters[b.dataset.field]=b.dataset.category;navigate('recipes');return}
 if(b.hasAttribute('data-reset')){state.query='';Object.keys(state.filters).forEach(k=>state.filters[k]='');if($('#search'))$('#search').value='';renderRecipes();return}
 if(b.hasAttribute('data-clear-search')){state.query='';$('#search').value='';renderRecipes();$('#search').focus();return}
 if(b.hasAttribute('data-safety')){showSafety();return}
 if(b.hasAttribute('data-cook')&&CONFIG.features.cookingMode){state.step=0;renderCooking();return}
 if(b.hasAttribute('data-next')){if(state.step<recipe(state.recipe).steps.length-1){state.step++;renderCooking();dialog.querySelector('[data-next]').focus({preventScroll:true})}else completeCooking();return}
 if(b.hasAttribute('data-prev')){state.step=Math.max(0,state.step-1);renderCooking();const prev=dialog.querySelector('[data-prev]');(prev.disabled?dialog.querySelector('[data-next]'):prev).focus({preventScroll:true});return}
 if(b.dataset.slot&&CONFIG.features.mealPlan){openPicker(b.dataset.slot);return}
 if(b.dataset.pick){assignPlan(state.slot,b.dataset.pick);return}
 if(b.hasAttribute('data-add-plan')&&CONFIG.features.mealPlan){checkDate();openSlots();return}
 if(b.dataset.assign){assignPlan(b.dataset.assign,state.recipe);return}
 if(b.dataset.removeSlot){delete state.plan[b.dataset.removeSlot];savePlan();renderMealPlan();observe();toast('Menu dihapus dari rencana hari ini.');return}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;renderRecipes()}if(e.target.id==='pick-search'){state.pickQuery=e.target.value;renderPickerList()}});
document.addEventListener('change',e=>{if(!e.target.matches('[data-check]'))return;const id=state.recipe,i=Number(e.target.dataset.check),set=new Set(checkedFor(id));e.target.checked?set.add(i):set.delete(i);state.checks[id]=[...set];save('checks',state.checks);$('#ingredient-count').textContent=`${set.size}/${recipe(id).ingredients.length} siap`});
window.addEventListener('scroll',()=>$('#topbar').classList.toggle('scrolled',scrollY>15),{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&checkDate()&&state.page==='today'){renderMealPlan();observe()}});
window.addEventListener('focus',()=>{if(checkDate()&&state.page==='today'){renderMealPlan();observe()}});
for(const [key,value]of Object.entries(CONFIG.theme))document.documentElement.style.setProperty('--'+key,value);
document.title=CONFIG.app.name+' — '+CONFIG.app.tagline;
document.querySelector('meta[name="description"]').content=CONFIG.app.name+' — '+CONFIG.recipes.length+' inspirasi resep MPASI, favorit, dan rencana makan harian. Bisa digunakan offline.';
document.querySelector('meta[name="theme-color"]').content=CONFIG.theme.background;
$('#brand-name').textContent=CONFIG.app.name;$('#brand-tagline').textContent=CONFIG.app.tagline;
setupInstall();randomize();renderFooter();renderPage();syncInstallUI();
</script>
</body>
</html>
